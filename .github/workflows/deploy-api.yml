name: Build and deploy api server

on:
  workflow_dispatch: # Manually trigger workflow
  workflow_run:
    workflows: [CI + CD]
    branches: [main]
    types:
      - completed

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Load Docker Image
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "${{ secrets.GH_REGISTRY_ACCESS_TOKEN }}" | docker login ghcr.io -u kopenkinda --password-stdin
            cd /racky
            docker pull ghcr.io/kopenkinda/racky-api:latest
            docker compose down
            docker compose up -d
